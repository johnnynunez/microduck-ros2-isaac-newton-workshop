name: CPU contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU and notebook test dependencies
        run: python -m pip install -e '.[policy,agent]' -r requirements-notebooks.txt
      - name: Run software contracts (not ROS or GPU acceptance)
        run: python -m pytest -m 'not ros and not gpu and not agent' -q
      - name: Check package syntax
        run: python -m compileall -q src
